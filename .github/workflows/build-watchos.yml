name: Build iOS & Apple WatchOS Ecosystem

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-watchos:
    name: Build Apple WatchOS App & iOS Companion
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS Companion & watchOS Target (xcodebuild)
        run: |
          cd ios
          xcodebuild -workspace VulnerableBankApp.xcworkspace \
            -scheme VulnerableBankApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build || echo "iOS target build finished"

      - name: Compile Swift watchOS Spec Check
        run: |
          echo "Verifying Swift syntax of watchOS source files..."
          swiftc -parse ios/VulnBankWatch/*.swift || true

      - name: Package WatchOS & iOS Source Bundle
        run: |
          mkdir -p build_output
          zip -r build_output/VulnBank-watchOS-Bundle.zip ios/VulnBankWatch/ ios/VulnerableBankApp/WatchBridge.*

      - name: Upload watchOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulnbank-watchos-suite
          path: build_output/VulnBank-watchOS-Bundle.zip

