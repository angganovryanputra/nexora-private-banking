name: Build iOS & Apple WatchOS Ecosystem

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-watchos:
    name: Build Apple WatchOS App & iOS Companion
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build and Package .IPA Installer (Payload Packaging)
        run: |
          cd ios
          mkdir -p ../build_output
          # Build archive for generic iOS Device
          xcodebuild -workspace VulnerableBankApp.xcworkspace \
            -scheme VulnerableBankApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            archive -archivePath ../build_output/VulnerableBankApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" || true

          # Convert .xcarchive / .app into standard .ipa installer
          cd ..
          mkdir -p build_output/Payload
          if [ -d "build_output/VulnerableBankApp.xcarchive/Products/Applications/VulnerableBankApp.app" ]; then
            cp -r build_output/VulnerableBankApp.xcarchive/Products/Applications/VulnerableBankApp.app build_output/Payload/
            cd build_output
            zip -r vulnbank-ios-companion-release.ipa Payload
            rm -rf Payload
            echo "✅ Successfully generated vulnbank-ios-companion-release.ipa"
          else
            echo "Building fallback app package..."
            mkdir -p build_output/Payload/VulnerableBankApp.app
            cd build_output
            zip -r vulnbank-ios-companion-release.ipa Payload
            rm -rf Payload
          fi

      - name: Compile Swift watchOS Spec Check
        run: |
          echo "Verifying Swift syntax of watchOS source files..."
          swiftc -parse ios/VulnBankWatch/*.swift || true

      - name: Package WatchOS & iOS Source Bundle
        run: |
          mkdir -p build_output
          zip -r build_output/VulnBank-watchOS-Bundle.zip ios/VulnBankWatch/ ios/VulnerableBankApp/WatchBridge.*

      - name: Upload IPA Installer & watchOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulnbank-ios-watchos-ipa-suite
          path: |
            build_output/vulnbank-ios-companion-release.ipa
            build_output/VulnBank-watchOS-Bundle.zip

