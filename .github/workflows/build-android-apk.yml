name: Build Android & Wear OS APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APKs (Universal, Wear OS & Companion)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Organize Release Artifacts & Generate Checksums
        run: |
          mkdir -p release_apks
          # Copy universal release apk to the 3 deployment flavors
          cp android/app/build/outputs/apk/release/app-release.apk release_apks/vulnbank-wear-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apks/vulnbank-mobile-companion-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk release_apks/vulnbank-universal-release.apk
          
          # Generate SHA-256 Checksums for integrity verification
          cd release_apks
          sha256sum *.apk > sha256_checksums.txt
          cat sha256_checksums.txt

      - name: Upload Release APK Suite Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulnbank-android-apk-release-suite
          path: |
            release_apks/vulnbank-wear-release.apk
            release_apks/vulnbank-mobile-companion-release.apk
            release_apks/vulnbank-universal-release.apk
            release_apks/sha256_checksums.txt
          retention-days: 30
